<section class="p-4">

  <nav aria-label="breadcrumb" class="app-breadcrumb mb-3">
    <ol class="breadcrumb mb-0">
      <li class="breadcrumb-item active" aria-current="page" data-i18n="rpt_breadcrumb">Report</li>
    </ol>
  </nav>

  <!-- REPORT TITLE -->
  <h1 class="page-title mb-0" data-i18n="rpt_pageTitle">Report</h1>
  <p class="page-subtitle mt-1 mb-3" data-i18n="rpt_pageSubtitle">Comprehensive KPI tracking and employee performance summary</p>

  <!-- SEARCH BAR -->
  <div class="report-search-wrapper mb-3">
    <i class="bi bi-search"></i>
    <input type="text" class="form-control report-search-input" data-i18n-placeholder="rpt_searchPlaceholder" placeholder="Search..." id="reportSearchInput">
  </div>

  <!-- FILTER + EXPORT SECTION -->
  <div class="filter-row report-filter-row mb-4">

    <!-- STATUS FILTER -->
    <div class="filter-item">
      <label data-i18n="rpt_filterStatus">STATUS:</label>
      <div class="dropdown-wrapper">
        <button class="custom-filter-btn" onclick="toggleReportDropdown(event, 'reportStatusDropdown')">
          <span id="reportSelectedStatus" data-i18n="rpt_statusAll">All Status</span>
          <i class="bi bi-chevron-down dropdown-icon"></i>
        </button>

        <div class="custom-dropdown" id="reportStatusDropdown">
          <button data-i18n="rpt_statusAll" onclick="selectReportDropdownOption('reportSelectedStatus', 'reportStatusDropdown', 'All Status')">All Status</button>
          <button data-i18n="rpt_statusInProgress" onclick="selectReportDropdownOption('reportSelectedStatus', 'reportStatusDropdown', 'In Progress')">In Progress</button>
          <button data-i18n="rpt_statusPendingVerification" onclick="selectReportDropdownOption('reportSelectedStatus', 'reportStatusDropdown', 'Pending Verification')">Pending Verification</button>
          <button data-i18n="rpt_statusCompleted" onclick="selectReportDropdownOption('reportSelectedStatus', 'reportStatusDropdown', 'Completed')">Completed</button>
          <button data-i18n="rpt_statusOverdue" onclick="selectReportDropdownOption('reportSelectedStatus', 'reportStatusDropdown', 'Overdue')">Overdue</button>
        </div>
      </div>
    </div>

    <!-- STAFF FILTER -->
    <div class="filter-item">
      <label data-i18n="rpt_filterStaff">STAFF:</label>
      <div class="dropdown-wrapper">
        <button class="custom-filter-btn" onclick="toggleReportDropdown(event, 'reportStaffDropdown')">
          <span id="reportSelectedStaff" data-i18n="rpt_staffAll">All Members</span>
          <i class="bi bi-chevron-down dropdown-icon"></i>
        </button>

        <div class="custom-dropdown" id="reportStaffDropdown">
          <button data-i18n="rpt_staffAll" onclick="selectReportDropdownOption('reportSelectedStaff', 'reportStaffDropdown', 'All Members')">All Members</button>
          <button onclick="selectReportDropdownOption('reportSelectedStaff', 'reportStaffDropdown', 'Ali Ahmad')">Ali Ahmad</button>
          <button onclick="selectReportDropdownOption('reportSelectedStaff', 'reportStaffDropdown', 'John Tan')">John Tan</button>
          <button onclick="selectReportDropdownOption('reportSelectedStaff', 'reportStaffDropdown', 'Sarah Chen')">Sarah Chen</button>
          <button onclick="selectReportDropdownOption('reportSelectedStaff', 'reportStaffDropdown', 'Marcus Low')">Marcus Low</button>
        </div>
      </div>
    </div>

    <!-- DATE RANGE FILTER -->
    <div class="filter-item date-filter-wrapper">
      <label data-i18n="rpt_filterDateRange">DATE RANGE:</label>
      <div class="dropdown-wrapper">
        <button class="custom-filter-btn date-range-btn d-flex align-items-center" onclick="toggleReportCalendar(event)">
          <span class="filter-text d-flex align-items-center">
            <i class="bi bi-calendar-event me-1"></i>
            <span id="reportSelectedDateRange" data-i18n="rpt_selectDateRange">Select Date Range</span>
          </span>

          <i class="bi bi-x-circle clear-report-date-icon d-none ms-2" onclick="clearReportDateFilter(event)"></i>

          <i class="bi bi-chevron-down dropdown-icon ms-2"></i>
        </button>

        <div class="calendar-dropdown" id="reportCalendarDropdown">
          <div class="calendar-header">
            <button onclick="reportPrevMonth()" class="calendar-arrow">
              <i class="bi bi-chevron-left"></i>
            </button>

            <h5 id="reportCalendarMonth">April 2026</h5>

            <button onclick="reportNextMonth()" class="calendar-arrow">
              <i class="bi bi-chevron-right"></i>
            </button>
          </div>

          <div class="calendar-weekdays">
            <span data-i18n="rpt_calMon">Mon</span>
            <span data-i18n="rpt_calTue">Tue</span>
            <span data-i18n="rpt_calWed">Wed</span>
            <span data-i18n="rpt_calThu">Thu</span>
            <span data-i18n="rpt_calFri">Fri</span>
            <span data-i18n="rpt_calSat">Sat</span>
            <span data-i18n="rpt_calSun">Sun</span>
          </div>

          <div class="calendar-days" id="reportCalendarDays"></div>

          <div class="calendar-actions">
            <button class="btn btn-light btn-sm" data-i18n="rpt_calCancel" onclick="cancelReportCalendar()">Cancel</button>
            <button class="btn btn-primary btn-sm" data-i18n="rpt_calChooseDate" onclick="chooseReportDate()">Choose Date</button>
          </div>
        </div>
      </div>
    </div>

    <!-- EXPORT BUTTONS -->
    <div class="report-export-actions ms-auto">
      <button class="report-export-pdf" onclick="exportReportPDF()">
        <i class="bi bi-filetype-pdf"></i>
        <span data-i18n="rpt_exportPdf">Export PDF</span>
      </button>

      <button class="report-export-csv" onclick="exportReportCSV()">
        <i class="bi bi-filetype-csv"></i>
        <span data-i18n="rpt_exportCsv">Export CSV</span>
      </button>
    </div>

  </div>

  <!-- KPI TABLE -->
  <div class="report-table-card">
    <div class="table-responsive">
      <table class="table table-borderless align-middle mb-0">
        <thead>
          <tr>
            <th data-i18n="rpt_thKpiName">KPI Name</th>
            <th data-i18n="rpt_thTargetValue">Target Value</th>
            <th data-i18n="rpt_thAssignTo">Assign To</th>
            <th data-i18n="rpt_thProgress">Progress</th>
            <th data-i18n="rpt_thStatus">Status</th>
            <th data-i18n="rpt_thDeadline">Deadline</th>
            <th class="text-center" data-i18n="rpt_thAction">Action</th>
          </tr>
        </thead>

        <tbody id="reportTableBody"></tbody>
      </table>
    </div>

    <div class="report-view-all">
      <button onclick="viewAllReportTasks()">
        <span data-i18n="rpt_showMore">Show More</span> <i class="bi bi-chevron-down"></i>
      </button>
    </div>
  </div>

  <!-- BOTTOM SUMMARY CARDS -->
  <div class="row g-4 mt-4">

    <div class="col-md-4">
      <div class="report-bottom-card">
        <p data-i18n="rpt_completionRate">Completion Rate</p>
        <div class="d-flex align-items-baseline gap-2">
          <h3 id="reportCompletionRate">0%</h3>
          <span class="positive-change" data-i18n="rpt_completionRateChange">+2.4% vs last mo</span>
        </div>
        <div class="report-progress">
          <div style="width: 84.2%"></div>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="report-bottom-card active-task-card">
        <p data-i18n="rpt_activeTasks">Active Tasks</p>
        <div class="d-flex align-items-baseline gap-2">
          <h3 id="reportActiveTasks">0</h3>
          <span data-i18n="rpt_onTrack">On Track</span>
        </div>

        <div class="task-bars">
          <div></div>
          <div></div>
          <div></div>
          <div class="warning"></div>
          <div class="empty"></div>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="report-bottom-card">
        <p data-i18n="rpt_upcomingDeadlines">Upcoming Deadlines</p>

        <div class="deadline-item">
          <span data-i18n="rpt_loadingDeadlines">Loading deadlines...</span>
          <small>-</small>
        </div>
      </div>
    </div>

  </div>

</section>
