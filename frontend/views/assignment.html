<section class="p-4">

  <!-- Breadcrumb -->
  <nav aria-label="breadcrumb" class="app-breadcrumb mb-3">
    <ol class="breadcrumb mb-0">
      <li class="breadcrumb-item">
        <a href="#" onclick="changePage(event, 'KPI Assignment & Verification')" data-i18n="assign_breadcrumbParent">KPI Assignment and Verification</a>
      </li>
      <li class="breadcrumb-item active" aria-current="page" data-i18n="assign_breadcrumbCurrent">Assign KPI</li>
    </ol>
  </nav>


  <!-- Title and Description -->
  <div class="mb-4">
    <h1 class="page-title" data-i18n="assign_pageTitle">Assign Staff</h1>
    <p class="page-subtitle mt-2">
      Create new owner assignment for <span class="fw-semibold text-dark">Sales Growth Rate</span> to track target
      achievement and ensure accountability.
    </p>
  </div>

  <div>
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">

        <!-- Header with Status -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h5 class="fw-bold mb-1" data-i18n="assign_primaryOwnerTitle">Primary Owner</h5>
            <p class="text-muted small mb-0" data-i18n="assign_primaryOwnerSubtitle">The individual responsible for this KPI's target achievement.</p>
          </div>
          <div class="d-flex align-items-center gap-2 px-3 py-2 rounded-3" style="background-color: #e7f3ff;">
            <i class="bi bi-clock-history text-primary fs-5"></i>
            <span class="text-primary fw-medium" data-i18n="assign_statusPending">Pending</span>
          </div>
        </div>

        <!-- Search Bar -->
        <div class="mb-4">
          <div class="position-relative">
            <i class="bi bi-search assign-search-icon"></i>
            <input type="text" id="staffSearchInput" class="form-control assign-search-input" placeholder="Filter Staff by name or department..." data-i18n-placeholder="assign_staffSearchPlaceholder" />
          </div>
        </div>

        <!-- Staff List -->
        <div class="staff-list" id="staffList">
          <!-- cards injected by assignment.js -->
        </div>

        <div class="d-flex justify-content-center mt-3">
          <button type="button" class="btn btn-secondary highLightButton m-1" data-i18n="assign_btnUpdateAssignment">Update Assignment</button>
          <button type="button" class="btn btn-light m-1" data-i18n="assign_btnDiscard">Discard</button>
        </div>
      </div>
    </div>
  </div>

</section>
