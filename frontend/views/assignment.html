<section class="p-4">

  <!-- Breadcrumb -->
  <nav aria-label="breadcrumb" class="app-breadcrumb mb-3">
    <ol class="breadcrumb mb-0">
      <li class="breadcrumb-item">
        <a href="#" onclick="changePage(event, 'KPI Assignment & Verification')">KPI Assignment and Verification</a>
      </li>
      <li class="breadcrumb-item active" aria-current="page">Assign KPI</li>
    </ol>
  </nav>


  <!-- Title and Description -->
  <div class="mb-4">
    <h1 class="page-title">Assign Staff</h1>
    <p class="page-subtitle mt-2">
      Create new owner assignment for <span class="fw-semibold text-dark">Sales Growth Rate</span> to track target
      achievement and ensure accountability.
    </p>
  </div>

  <div>
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">

        <!-- Header with Status -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h5 class="fw-bold mb-1">Primary Owner</h5>
            <p class="text-muted small mb-0">The individual responsible for this KPI's target achievement.</p>
          </div>
          <div class="d-flex align-items-center gap-2 px-3 py-2 rounded-3" style="background-color: #e7f3ff;">
            <i class="bi bi-clock-history text-primary fs-5"></i>
            <span class="text-primary fw-medium">Pending</span>
          </div>
        </div>

        <!-- Search Bar -->
        <div class="mb-4">
          <div class="search-wrapper w-100">
            <i class="bi bi-search"></i>
            <input type="text" class="form-control search-box" placeholder="Filter Staff by name or department..."
              style="width: 100%;" />
          </div>
        </div>

        <!-- Staff List -->
        <div class="staff-list" id="staffList">
          <!-- cards injected by assignment.js -->
        </div>

        <div class="d-flex justify-content-center mt-3">
          <button type="button" class="btn btn-secondary highLightButton m-1">Update Assignment</button>
          <button type="button" class="btn btn-light m-1">Discard</button>
        </div>
      </div>
    </div>
  </div>

</section>
