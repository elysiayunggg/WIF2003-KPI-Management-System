<section class="p-4 kpi-list-view">

  <nav aria-label="breadcrumb" class="app-breadcrumb mb-3">
    <ol class="breadcrumb mb-0">
      <li class="breadcrumb-item"><a href="#" onclick="changePage(event, 'KPI Management')" data-i18n="kpiList_breadcrumbParent">KPI Management</a></li>
      <li class="breadcrumb-item active" aria-current="page" data-i18n="kpiList_breadcrumbCurrent">KPI List</li>
    </ol>
  </nav>

  <h1 class="page-title mb-3" data-i18n="kpiList_pageTitle">KPI List</h1>

  <div class="card border-0 shadow-sm p-3">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h6 class="fw-bold mb-0" data-i18n="kpiList_cardTitle">KPI List</h6>
    </div>

    <div class="report-search-wrapper mb-2">
      <i class="bi bi-search"></i>
      <input type="text" class="form-control report-search-input" id="kpiListSearch"
        placeholder="Search KPI name, department, or staff..." data-i18n-placeholder="kpiList_searchPlaceholder">
    </div>

    <div class="kpi-filter-bar mb-4">
      <div class="filter-item">
        <label for="kpiListStatusFilter">STATUS:</label>
        <select class="custom-filter-btn" id="kpiListStatusFilter">
          <option value="">All Status</option>
          <option value="Not Started">Not Started</option>
          <option value="In Progress">In Progress</option>
          <option value="Pending Verification">Pending Verification</option>
          <option value="Completed">Completed</option>
          <option value="Rejected">Rejected</option>
          <option value="Overdue">Overdue</option>
          <option value="Unassigned">Unassigned</option>
        </select>
      </div>
      <div class="filter-item">
        <label for="kpiListStaffFilter">STAFF:</label>
        <select class="custom-filter-btn" id="kpiListStaffFilter">
          <option value="">All Members</option>
        </select>
      </div>
      <div class="filter-item kpi-date-filter">
        <label>DATE RANGE:</label>
        <details class="kpi-date-range">
          <summary class="custom-filter-btn">
            <i class="bi bi-calendar-event"></i>
            <span id="kpiListDateLabel">Select Date Range</span>
            <i class="bi bi-chevron-down"></i>
          </summary>
          <div class="kpi-date-range__panel">
            <label for="kpiListStartDate">From</label>
            <input type="date" class="form-control" id="kpiListStartDate">
            <label for="kpiListEndDate">To</label>
            <input type="date" class="form-control" id="kpiListEndDate">
            <button type="button" class="btn btn-sm btn-outline-secondary" id="clearKpiListFilters">Clear dates</button>
          </div>
        </details>
      </div>
    </div>

    <!-- Table Header -->
    <div class="row text-muted small fw-bold mb-2 px-2 kpi-list-header">
      <div class="col-4" data-i18n="kpiList_colKpiName">KPI NAME</div>
      <div class="col-4" data-i18n="kpiList_colTargetProgress">TARGET PROGRESS</div>
      <div class="col-2" data-i18n="kpiList_colStatus">STATUS</div>
      <div class="col-2 text-end" data-i18n="kpiList_colDetails">DETAILS</div>
    </div>

    <!-- KPI LIST -->
    <div id="kpiListContainer"></div>

    <!-- Pagination -->
    <div class="d-flex justify-content-between mt-3">
      <small id="listSummary" class="text-muted"></small>

      <div>
        <button id="listPrev" class="btn btn-sm btn-light" data-i18n="kpiList_paginationPrev">Previous</button>
        <span id="listPages"></span>
        <button id="listNext" class="btn btn-sm btn-light" data-i18n="kpiList_paginationNext">Next</button>
      </div>
    </div>

  </div>

</section>
