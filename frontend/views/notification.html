<section class="p-4 notifications-view">

  <!-- Breadcrumb -->
  <nav aria-label="breadcrumb" class="app-breadcrumb mb-3">
    <ol class="breadcrumb mb-0">
      <li class="breadcrumb-item active" aria-current="page" data-i18n="notif_breadcrumbCurrent">Notifications</li>
    </ol>
  </nav>

  <!-- Title -->
  <div class="mb-4">
    <h1 class="page-title mb-0" data-i18n="notif_pageTitle">Recent Activities</h1>
  </div>

  <!-- Row 1: Search + Mark all as read -->
  <div class="d-flex align-items-center gap-3 mb-3">
    <div class="notif-report-search-wrapper flex-grow-1">
      <i class="bi bi-search"></i>
      <input
        type="text"
        id="notifPageSearch"
        class="form-control notif-report-search-input"
        placeholder="Search activity details..."
        data-i18n-placeholder="notif_searchPlaceholder"
        oninput="filterNotificationsBySearch(this.value)"
      />
    </div>
    <button
      class="btn notif-mark-all-btn d-inline-flex align-items-center gap-2"
      onclick="markAllAsRead(); renderNotificationCards(activeNotifTab)"
    >
      <i class="bi bi-check-all"></i>
      <span data-i18n="notif_markAllRead">Mark all as read</span>
    </button>
  </div>

  <!-- Row 2: Filter Tabs -->
  <div class="d-flex flex-wrap gap-2 mb-4" id="notifTabGroup">
    <button class="btn notif-tab notif-tab-active" onclick="switchNotifTab(this, 'All Activities')" data-i18n="notif_tabAll">All Activities</button>
    <button class="btn notif-tab" onclick="switchNotifTab(this, 'Submissions')" data-i18n="notif_tabSubmissions">Submissions</button>
    <button class="btn notif-tab" onclick="switchNotifTab(this, 'Approvals')" data-i18n="notif_tabApprovals">Approvals</button>
    <button class="btn notif-tab" onclick="switchNotifTab(this, 'Deadlines')" data-i18n="notif_tabDeadlines">Deadlines</button>
    <button class="btn notif-tab" onclick="switchNotifTab(this, 'System')" data-i18n="notif_tabSystem">System</button>
  </div>

  <!-- Notification Cards Container -->
  <div id="notificationPageList"></div>

  <!-- Divider + Footer -->
  <hr class="notif-page-divider my-3">
  <div class="d-flex justify-content-between align-items-center notif-page-footer">
    <span id="notifTotalCount" class="text-muted small"></span>
    <button
      class="btn notif-delete-all-btn p-0"
      onclick="deleteAllNotificationsPage()"
      data-i18n="notif_deleteAllBtn"
    >
      Delete all notifications
    </button>
  </div>

</section>
