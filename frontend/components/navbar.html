<header class="topbar d-flex justify-content-between align-items-center px-4">
    <div class="position-relative flex-grow-1 topbar-search-wrapper">
      <i class="bi bi-search topbar-search-icon"></i>
      <input
        type="text"
        class="form-control topbar-search-input"
        data-i18n-placeholder="searchPlaceholder"
        placeholder="Search..."
        onkeyup="searchKPI()"
        id="searchInput"
      />
    </div>

    <div class="d-flex align-items-center gap-4">
      <div class="notification-wrapper position-relative">
        <button class="notification-btn" onclick="showNotification()" id="notificationBell">
          <i class="bi bi-bell"></i>
          <span id="unreadBadge" style="display: none;"></span>
        </button>

        <div class="notification-overlay" id="notificationOverlay">
          <div class="notification-header">
            <h6 data-i18n="notifHeader">Notifications</h6>
            <button type="button" class="mark-all-read" onclick="markAllAsRead()" data-i18n="notifMarkAllRead">Mark all read</button>
          </div>
          <div class="notification-list" id="notificationList"></div>
          <div class="notification-footer">
            <a href="#" onclick="changePage(event, 'Notifications')" data-i18n="notifViewAll">View all notifications</a>
          </div>
        </div>
      </div>

      <button class="navbar-avatar-btn" onclick="changePage(event, 'Profile')" title="View Profile">
        <img id="navbarAvatarImg" src="" alt="Profile" class="navbar-avatar-img">
      </button>
    </div>
</header>
